<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#0f0a1e" stroke="url(#moonGrad)" stroke-width="2"/>

  <!-- Outer ring glow -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#moonGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Shield body -->
  <path d="M100 30 L155 58 L155 105 C155 140 128 162 100 172 C72 162 45 140 45 105 L45 58 Z"
    fill="url(#shieldGrad)" opacity="0.85" filter="url(#glow)"/>

  <!-- Shield outline -->
  <path d="M100 30 L155 58 L155 105 C155 140 128 162 100 172 C72 162 45 140 45 105 L45 58 Z"
    fill="none" stroke="url(#moonGrad)" stroke-width="2"/>

  <!-- ZK letters -->
  <text x="100" y="118" font-family="monospace" font-size="38" font-weight="900"
    fill="white" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">ZK</text>

  <!-- Crescent moon icon top -->
  <path d="M98 52 Q88 62 88 74 Q88 86 98 93 Q88 91 80 84 Q72 74 72 63 Q72 52 80 46 Q88 40 98 40 Q95 46 98 52 Z"
    fill="white" opacity="0.9" filter="url(#glow)"/>

  <!-- Stars -->
  <circle cx="148" cy="55" r="2" fill="white" opacity="0.7"/>
  <circle cx="53" cy="75" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="160" cy="100" r="1.5" fill="url(#moonGrad)" opacity="0.8"/>

  <!-- Bottom text label -->
  <text x="100" y="188" font-family="monospace" font-size="11" font-weight="700"
    fill="#a78bfa" text-anchor="middle" letter-spacing="3">COMPLIANCE GATE</text>
</svg>
