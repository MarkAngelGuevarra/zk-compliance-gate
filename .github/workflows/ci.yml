## ZK Compliance Gate CI/CD — Level 3+ Pipeline
## Runs on every push and pull request to main branch

name: CI — Build, Lint & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint source files
        run: npm run lint

      - name: 🧪 Run test suite with coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: 📊 Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  compile-check:
    name: Compact Contract Compile Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔧 Install Midnight Compact compiler
        run: |
          npm install -g @midnight-ntwrk/compact-cli
          compact --version

      - name: ⚙️ Compile gate.compact contract
        run: compact compile contracts/gate.compact --output managed/

      - name: ✅ Verify managed/ artifacts exist
        run: |
          ls -la managed/
          echo "Contract compiled successfully!"
